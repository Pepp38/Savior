<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Savior – Drivers</title>
</head>
<body>
  <h1>Savior – Drivers</h1>

  <form id="driver-form" data-savior>
    <input type="text" name="data" placeholder="Some data" />
    <button type="submit">Submit</button>
  </form>

<script type="module">
  import Savior from '../../savior.js';

  // Récupérer SessionStorageDriver depuis l'objet par défaut
  const { SessionStorageDriver } = Savior;

  // Initialisation avec LocalStorageDriver (par défaut)
  const coreLocal = Savior.init({
    selector: '#driver-form',
    debug: true,
    storageKeyPrefix: 'savior:test:driver:local:',
  });

  // Exposer une fonction globale pour basculer sur SessionStorageDriver
  window.useSessionDriver = () => {
    if (coreLocal && typeof coreLocal.destroy === 'function') {
      coreLocal.destroy();
    }

    Savior.init({
      selector: '#driver-form',
      debug: true,
      driver: new SessionStorageDriver({
        debug: true,
        storageKeyPrefix: 'savior:test:driver:session:',
      }),
    });
  };
</script>


</body>
</html>
